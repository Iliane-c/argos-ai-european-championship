id: E170_segb5_v2
parent: base
# Round v2. synth-v2 (COCO bases; holes restored / pasted / inpainted) + fixed recipe: no
# wrong-message negatives and no cached maps (they are a constant 0.5 on every synth sample).
# Capacity bet: SegFormer-B5. Compare with E171 (same recipe, B2).
data:
  train: [real, synth-v2]
  train_folds: [1, 2, 3, 4]
  val: f0
  synth_ratio: 0.85
  epoch_samples: 8000
input:
  channels: [rgb, srm]
model:
  name: smp
  arch: Segformer
  encoder: mit_b5
  encoder_weights: imagenet
  feat_dim: 64
  cond: method
  heads: [mask, kind]
loss:
  bce: 0.4
  dice: 0.4
  dual_iou: 1.0
  lovasz: 0.3
  aux_kind: 0.1
train:
  epochs: 24
  batch: 8
  lr: 1.5e-4
  workers: 6
post:
  threshold: oof
